<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>週邊們</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="週邊們">
  <link rel="apple-touch-icon" sizes="180x180" id="apple-icon">
  <link rel="icon" type="image/png" id="favicon">

  <!-- 引入 SheetJS 處理原生 .xlsx 匯出 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-color: #94B4CB;
      --primary-light: #eef4f8;
      --primary-dark: #6a8ea8;
      --bg-color: #f9fbfd;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --border-color: #e2e8f0;
      --danger-color: #e74c3c;
      --success-color: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }

    header {
      background: var(--card-bg);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      box-shadow: 0 2px 10px rgba(148, 180, 203, 0.1);
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-title-box { display: flex; align-items: center; gap: 8px; }
    .header-logo-box { width: 28px; height: 28px; border-radius: 6px; overflow: hidden; background: #fff; }
    .header-logo-box canvas { width: 100%; height: 100%; }
    .header-title { font-size: 1.15rem; font-weight: 700; color: var(--primary-dark); }
    .settings-btn { border: none; background: none; font-size: 1.2rem; cursor: pointer; color: var(--primary-dark); }

    .tabs { display: flex; background: var(--primary-light); border-radius: 12px; padding: 3px; margin: 10px 16px 0 16px; }
    .tab-btn {
      flex: 1; border: none; background: transparent; padding: 8px 0;
      font-size: 0.85rem; font-weight: 600; color: var(--text-sub);
      border-radius: 9px; cursor: pointer; transition: all 0.2s ease;
    }
    .tab-btn.active { background: var(--card-bg); color: var(--primary-dark); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

    .search-bar-box { padding: 10px 16px 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .search-top-row { display: flex; gap: 8px; }
    .search-input { flex: 1; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.85rem; outline: none; }
    .sort-select { padding: 8px; border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.8rem; background: #fff; color: var(--text-main); }
    
    .date-filter-row { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-sub); }
    .date-input { flex: 1; padding: 6px 8px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.75rem; background: #fff; outline: none; }
    .btn-clear-date { border: none; background: var(--primary-light); color: var(--primary-dark); padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 0.85rem; }
    .breadcrumbs { color: var(--primary-dark); font-weight: 600; overflow-x: auto; white-space: nowrap; }
    .breadcrumbs span { cursor: pointer; text-decoration: underline; }

    .container { padding: 0 16px 16px 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    
    .card {
      background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border-color);
      padding: 12px; display: flex; flex-direction: column; position: relative;
      box-shadow: 0 4px 12px rgba(148, 180, 203, 0.08);
    }
    .card-folder { border-left: 4px solid var(--primary-color); cursor: pointer; }
    .card-img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: var(--primary-light); }
    .card-no-img {
      width: 100%; height: 110px; border-radius: 8px; margin-bottom: 8px;
      background: var(--primary-light); color: var(--primary-dark);
      display: flex; justify-content: center; align-items: center; font-size: 0.8rem; font-weight: 600;
    }
    .card-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-sub { font-size: 0.75rem; color: var(--text-sub); }
    
    .badge-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .badge { display: inline-block; padding: 2px 6px; background: var(--primary-light); color: var(--primary-dark); border-radius: 6px; font-size: 0.7rem; font-weight: 600; }
    .badge-danger { background: #fde8e8; color: var(--danger-color); }
    .badge-success { background: #e8f8f0; color: var(--success-color); }

    .fab-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; background: var(--card-bg); padding: 8px 16px;
      border-radius: 30px; box-shadow: 0 6px 20px rgba(148, 180, 203, 0.3);
      border: 1px solid var(--border-color); z-index: 99;
    }
    .fab-btn {
      border: none; background: var(--primary-color); color: white;
      padding: 8px 14px; border-radius: 20px; font-weight: 600; font-size: 0.8rem;
      cursor: pointer;
    }
    .fab-btn.secondary { background: var(--primary-light); color: var(--primary-dark); }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg); width: 100%; max-height: 88vh; border-radius: 20px 20px 0 0;
      padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .modal-title { font-weight: 700; color: var(--primary-dark); }
    .close-btn { border: none; background: none; font-size: 1.2rem; color: var(--text-sub); cursor: pointer; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;
      font-size: 0.9rem; outline: none; background: #fff;
    }
    .form-control:focus { border-color: var(--primary-color); }
    textarea.form-control { resize: vertical; min-height: 60px; }

    .photo-uploader { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .photo-preview { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); }
    .photo-add-btn {
      width: 60px; height: 60px; border-radius: 8px; border: 1px dashed var(--primary-color);
      display: flex; justify-content: center; align-items: center; color: var(--primary-color);
      font-size: 1.2rem; cursor: pointer; background: var(--primary-light);
    }

    .btn-submit { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; margin-top: 10px; cursor: pointer; }
    .btn-transfer { width: 100%; padding: 12px; background: var(--success-color); color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; margin-top: 10px; cursor: pointer; }
    .btn-sell { width: 100%; padding: 12px; background: #f39c12; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600; margin-top: 10px; cursor: pointer; }
    .btn-delete { width: 100%; padding: 10px; background: transparent; color: var(--danger-color); border: none; font-size: 0.85rem; margin-top: 5px; cursor: pointer; }

    .calc-box { background: var(--primary-light); padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 0.85rem; color: var(--primary-dark); font-weight: 600; }
    .other-input-block { margin-top: 6px; display: none; }
    .checkbox-inline { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--primary-dark); }

    .checkbox-group-box {
      background: var(--primary-light);
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }
    .checkbox-group-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-title-box">
      <div class="header-logo-box">
        <canvas id="header-logo-canvas" width="180" height="180"></canvas>
      </div>
      <span class="header-title">週邊們</span>
    </div>
    <button class="settings-btn" onclick="openModal('modal-settings')">⚙️</button>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-arrived" onclick="switchTab('arrived')">在家/已到貨</button>
    <button class="tab-btn" id="tab-preorder" onclick="switchTab('preorder')">預購（未到貨）</button>
    <button class="tab-btn" id="tab-forsale" onclick="switchTab('forsale')">待售專區</button>
  </div>

  <!-- Search, Sort & Date Filter -->
  <div class="search-bar-box">
    <div class="search-top-row">
      <input type="text" id="search-input" class="search-input" placeholder="搜尋品項、分類、備註..." oninput="renderGrid()">
      <select id="sort-select" class="sort-select" onchange="renderGrid()">
        <option value="default">預設排序</option>
        <option value="date-desc">日期：新 ➔ 舊</option>
        <option value="date-asc">日期：舊 ➔ 新</option>
        <option value="price-desc">價格：高 ➔ 低</option>
        <option value="price-asc">價格：低 ➔ 高</option>
      </select>
    </div>
    <div class="date-filter-row">
      <input type="date" id="date-start" class="date-input" onchange="renderGrid()">
      <span>～</span>
      <input type="date" id="date-end" class="date-input" onchange="renderGrid()">
      <button class="btn-clear-date" onclick="clearDateFilter()">✕ 清除</button>
    </div>
  </div>

  <!-- Breadcrumbs Nav -->
  <div class="nav-bar">
    <div class="breadcrumbs" id="breadcrumbs">路徑: <span>主目錄</span></div>
  </div>

  <!-- Main Container -->
  <div class="container">
    <div class="grid" id="grid-container"></div>
  </div>

  <!-- FAB -->
  <div class="fab-bar">
    <button class="fab-btn secondary" onclick="openFolderModal()">新增資料夾</button>
    <button class="fab-btn" onclick="openItemModal()">新增品項</button>
    <button class="fab-btn secondary" onclick="openExportModal()">📊 匯出 Excel</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="modal-settings">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">系統設定與歷史記錄</div>
        <button class="close-btn" onclick="closeModal('modal-settings')">✕</button>
      </div>
      <button class="btn-submit" style="background:var(--primary-dark);" onclick="openSoldArchiveModal()">📦 查看已售出歸檔庫</button>
      <hr style="margin: 15px 0; border: none; border-top: 1px solid var(--border-color);">
      <button class="btn-submit" style="background:#34495e;" onclick="backupData()">💾 備份資料 (JSON)</button>
      <button class="btn-submit" style="background:#7f8c8d; margin-top:8px;" onclick="restoreData()">🔄 還原資料 (JSON)</button>
    </div>
  </div>

  <!-- Folder Modal -->
  <div class="modal" id="modal-folder">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="folder-modal-title">新增/編輯資料夾</div>
        <button class="close-btn" onclick="closeModal('modal-folder')">✕</button>
      </div>
      <div class="form-group">
        <label>資料夾名稱</label>
        <input type="text" id="folder-name" class="form-control" placeholder="例如：專輯專區、巡演週邊">
      </div>
      <div class="form-group">
        <label>上層資料夾 (手動搬家/層級)</label>
        <select id="folder-parent-select" class="form-control"></select>
      </div>
      <div class="form-group">
        <label>自訂封面照片 (選填，無上傳則不顯示封面)</label>
        <div class="photo-uploader" id="uploader-folder-cover"></div>
      </div>
      <button class="btn-submit" onclick="saveFolder()">儲存資料夾</button>
      <button class="btn-delete" id="btn-delete-folder" style="display:none;" onclick="deleteCurrentFolder()">刪除資料夾</button>
    </div>
  </div>

  <!-- Item Modal -->
  <div class="modal" id="modal-item">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="item-modal-title">品項內容</div>
        <button class="close-btn" onclick="closeModal('modal-item')">✕</button>
      </div>
      
      <form id="item-form" onsubmit="event.preventDefault();">
        <!-- 待售標籤勾選 -->
        <div class="form-group" style="background:var(--primary-light); padding:10px; border-radius:8px;">
          <label class="checkbox-inline">
            <input type="checkbox" id="field-is-forsale" onchange="toggleForsaleFolderGroup()"> 🏷️ 加入「待售專區」
          </label>
        </div>

        <div class="form-group" id="group-forsale-folder" style="display:none;">
          <label>待售區專屬分類/資料夾</label>
          <select id="field-forsale-folder-select" class="form-control"></select>
        </div>

        <!-- 所屬資料夾選擇（樹狀呈現） -->
        <div class="form-group">
          <label>所屬資料夾 (可手動移動位置)</label>
          <select id="field-folder-select" class="form-control"></select>
        </div>

        <div class="form-group">
          <label>1. 分類</label>
          <select id="field-category" class="form-control" onchange="toggleAlbumFields()">
            <option value="專輯/EP">專輯/EP</option>
            <option value="巡演場週">巡演場週</option>
            <option value="團體公司週邊">團體公司週邊</option>
            <option value="單人公司週邊">單人公司週邊</option>
            <option value="節目週邊">節目週邊</option>
            <option value="快閃店/展覽限定">快閃店/展覽限定</option>
            <option value="生日/紀念日限定">生日/紀念日限定</option>
            <option value="粉絲應援/站姐週邊">粉絲應援/站姐週邊</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="form-group">
          <label id="label-item-type">2. 品項</label>
          <select id="field-item-type" class="form-control">
            <option value="專輯">專輯</option>
            <option value="娃">娃</option>
            <option value="玩偶">玩偶</option>
            <option value="擺飾">擺飾</option>
            <option value="家居">家居</option>
            <option value="卡套">卡套</option>
            <option value="應援">應援</option>
            <option value="服飾/配件">服飾/配件</option>
            <option value="鑰匙圈/掛飾">鑰匙圈/掛飾</option>
            <option value="徽章/Pin">徽章/Pin</option>
            <option value="文具/海報/寫真">文具/海報/寫真</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <!-- Part (一): 在家/已到貨 欄位 -->
        <div id="section-arrived-fields">
          <div class="form-group">
            <label>品項名稱 (自訂稱呼)</label>
            <input type="text" id="field-title" class="form-control" placeholder="例如：EXIST 藍色版">
          </div>
          <div class="form-group">
            <label>3. 價格</label>
            <input type="number" id="field-price" class="form-control" placeholder="0">
          </div>
          <div class="form-group">
            <label>4. 照片 (1-3張)</label>
            <div class="photo-uploader" id="uploader-photos"></div>
          </div>
          <div class="form-group">
            <label>5. 購入/得到日期</label>
            <input type="date" id="field-received-date" class="form-control">
          </div>
          <div class="form-group">
            <label>6. 購買證明</label>
            <div class="photo-uploader" id="uploader-proofs"></div>
          </div>

          <!-- 專輯內容物 -->
          <div class="form-group" id="group-album-contents" style="display:none; background:#f0f7fc; padding:10px; border-radius:8px;">
            <label style="color:var(--primary-dark)">7. 專輯內容物</label>
            <textarea id="field-album-text" class="form-control" placeholder="文字說明..."></textarea>
            <label style="margin-top:6px;">內容物照片：</label>
            <div class="photo-uploader" id="uploader-album"></div>
          </div>

          <div class="form-group">
            <label>8. 其他說明</label>
            <textarea id="field-notes" class="form-control" placeholder="備註..."></textarea>
          </div>
          <div class="form-group">
            <label>9. 資訊</label>
            <textarea id="field-info" class="form-control" placeholder="轉移資訊或備註..."></textarea>
          </div>
        </div>

        <!-- Part (二): 預購（未到貨） 欄位 -->
        <div id="section-preorder-fields" style="display:none;">
          <div class="form-group">
            <label>品項名稱 (自訂稱呼)</label>
            <input type="text" id="field-pre-title" class="form-control" placeholder="例如：2026巡演官方應援棒">
          </div>
          <div class="form-group">
            <label>3. 照片 (1-3張)</label>
            <div class="photo-uploader" id="uploader-pre-photos"></div>
          </div>
          <div class="form-group">
            <label>4. 下單日期</label>
            <input type="date" id="field-pre-date" class="form-control">
          </div>
          <div class="form-group">
            <label>5. 預計抵達時間</label>
            <input type="text" id="field-pre-eta" class="form-control" placeholder="例如：2026年10月下旬">
          </div>
          <div class="form-group">
            <label>購買證明 (照片)</label>
            <div class="photo-uploader" id="uploader-pre-proofs"></div>
          </div>

          <!-- 付款狀態選單 -->
          <div class="form-group">
            <label>6. 付款狀態選擇</label>
            <select id="field-pay-type" class="form-control" onchange="togglePaymentFlow()">
              <option value="全付">全付</option>
              <option value="付一半（訂金）">付一半（訂金）</option>
              <option value="未付">未付</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <!-- 分支 1: 全付 -->
          <div id="flow-full" class="flow-block">
            <div class="form-group">
              <label>總金額（不含運） (必填)</label>
              <input type="number" id="pre-full-price" class="form-control" oninput="calcFullTotal()">
            </div>
            <div class="form-group">
              <label>是否需二補</label>
              <select id="pre-full-need-second" class="form-control">
                <option value="否">否</option>
                <option value="是">是</option>
              </select>
            </div>
            <div class="form-group">
              <label>付款方式</label>
              <select id="pre-full-paymethod" class="form-control" onchange="checkOtherField(this, 'pre-full-paymethod-other')">
                <option value="轉帳">轉帳</option><option value="信用卡">信用卡</option><option value="現金">現金</option><option value="LINE Pay">LINE Pay</option><option value="賣貨便">賣貨便</option><option value="其他">其他</option>
              </select>
              <input type="text" id="pre-full-paymethod-other" class="form-control other-input-block" placeholder="請填寫付款方式說明">
            </div>
            <div class="form-group">
              <label>寄送方式</label>
              <select id="pre-full-shipmethod" class="form-control" onchange="checkOtherShipField(this, 'pre-full-ship-group', 'pre-full-shipmethod-other')">
                <option value="賣貨便">賣貨便</option><option value="郵寄">郵寄</option><option value="面交">面交</option><option value="其他">其他</option>
              </select>
              <input type="text" id="pre-full-shipmethod-other" class="form-control other-input-block" placeholder="請填寫寄送方式說明">
            </div>
            <div class="form-group" id="pre-full-ship-group">
              <label>運費 (若無填0)</label>
              <input type="number" id="pre-full-shipfee" class="form-control" value="0" oninput="calcFullTotal()">
            </div>
            <div class="calc-box" id="calc-full-result">金額加總: $0</div>
            <div class="form-group" style="margin-top:10px;">
              <label>其他說明</label>
              <textarea id="pre-full-notes" class="form-control" placeholder="備註..."></textarea>
            </div>
          </div>

          <!-- 分支 2: 付一半（訂金） -->
          <div id="flow-half" class="flow-block" style="display:none;">
            <div class="form-group">
              <label>1. 總金額（不含運） (必填)</label>
              <input type="number" id="pre-half-total" class="form-control" oninput="calcHalfTotal()">
            </div>
            <div class="form-group">
              <label>是否需二補</label>
              <select id="pre-half-need-second" class="form-control">
                <option value="否">否</option>
                <option value="是">是</option>
              </select>

  <script>
    // --- Canvas PNG Generator for iOS Icon ---
    function generatePngLogo() {
      const canvas = document.createElement('canvas');
      canvas.width = 180; canvas.height = 180;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, 180, 180);
      ctx.fillStyle = '#94B4CB';
      ctx.beginPath(); ctx.moveTo(90, 85); ctx.bezierCurveTo(50, 35, 15, 55, 35, 95); ctx.bezierCurveTo(55, 130, 82, 105, 90, 95); ctx.fill();
      ctx.beginPath(); ctx.moveTo(90, 85); ctx.bezierCurveTo(130, 35, 165, 55, 145, 95); ctx.bezierCurveTo(125, 130, 98, 105, 90, 95); ctx.fill();
      ctx.beginPath(); ctx.moveTo(90, 92); ctx.bezierCurveTo(70, 125, 35, 145, 50, 155); ctx.bezierCurveTo(75, 135, 88, 115, 90, 100); ctx.fill();
      ctx.beginPath(); ctx.moveTo(90, 92); ctx.bezierCurveTo(110, 125, 145, 145, 130, 155); ctx.bezierCurveTo(105, 135, 92, 115, 90, 100); ctx.fill();
      ctx.fillStyle = '#6a8ea8'; ctx.beginPath(); ctx.arc(90, 91, 10, 0, Math.PI * 2); ctx.fill();

      const pngDataUrl = canvas.toDataURL('image/png');
      document.getElementById('apple-icon').href = pngDataUrl;
      document.getElementById('favicon').href = pngDataUrl;

      const headerCanvas = document.getElementById('header-logo-canvas');
      if (headerCanvas) headerCanvas.getContext('2d').drawImage(canvas, 0, 0);
    }
    generatePngLogo();

    // --- State & IndexedDB Init ---
    let db;
    let currentTab = 'arrived'; // 'arrived', 'preorder', 'forsale'
    let currentFolderId = null;
    let folderPath = [];
    let editingItemId = null;
    let editingFolderId = null;

    let imgStore = { photos: [], proofs: [], album: [], prePhotos: [], preProofs: [], sellProofs: [], folderCover: [] };

    const request = indexedDB.open("MerchCollectorDB_v3", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("folders")) db.createObjectStore("folders", { keyPath: "id" });
      if (!db.objectStoreNames.contains("items")) db.createObjectStore("items", { keyPath: "id" });
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      renderGrid();
    };

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-arrived').classList.toggle('active', tab === 'arrived');
      document.getElementById('tab-preorder').classList.toggle('active', tab === 'preorder');
      document.getElementById('tab-forsale').classList.toggle('active', tab === 'forsale');
      currentFolderId = null;
      folderPath = [];
      updateBreadcrumbs();
      renderGrid();
    }

    function updateBreadcrumbs() {
      const bc = document.getElementById('breadcrumbs');
      let html = `路徑: <span onclick="navigateToFolder(null)">主目錄</span>`;
      folderPath.forEach((f, index) => {
        html += ` > <span onclick="navigateToPathIndex(${index})">${f.name}</span>`;
      });
      bc.innerHTML = html;
    }

    function navigateToFolder(folderId, folderName) {
      if (folderId === null) {
        currentFolderId = null; folderPath = [];
      } else {
        currentFolderId = folderId; folderPath.push({ id: folderId, name: folderName });
      }
      updateBreadcrumbs();
      renderGrid();
    }

    function navigateToPathIndex(index) {
      folderPath = folderPath.slice(0, index + 1);
      currentFolderId = folderPath[folderPath.length - 1].id;
      updateBreadcrumbs();
      renderGrid();
    }

    function clearDateFilter() {
      document.getElementById('date-start').value = '';
      document.getElementById('date-end').value = '';
      renderGrid();
    }

    // --- Render Items & Folders (含關鍵字、資料夾與日期區間多重過濾) ---
    function renderGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();
      const sortType = document.getElementById('sort-select').value;
      const dateStart = document.getElementById('date-start').value;
      const dateEnd = document.getElementById('date-end').value;

      const tx = db.transaction(["folders", "items"], "readonly");
      const folderStore = tx.objectStore("folders");
      const itemStore = tx.objectStore("items");

      let folders = [];
      let itemMap = new Map(); // 使用 Map 徹底去重

      folderStore.openCursor().onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const f = cursor.value;
          // 有設定日期區間時不顯示資料夾（直接專注過濾品項）
          if (!dateStart && !dateEnd) {
            if (searchKeyword) {
              // 有關鍵字：資料夾名稱包含關鍵字才顯示
              if (f.tab === currentTab && f.name.toLowerCase().includes(searchKeyword)) {
                folders.push(f);
              }
            } else {
              // 無關鍵字：只顯示目前目錄層級下的資料夾
              if (f.tab === currentTab && f.parentId === currentFolderId) {
                folders.push(f);
              }
            }
          }
          cursor.continue();
        } else {
          itemStore.openCursor().onsuccess = (e2) => {
            const cursor2 = e2.target.result;
            if (cursor2) {
              const val = cursor2.value;
              if (!val.isSold) {
                const isGlobalSearch = searchKeyword || dateStart || dateEnd;

                if (isGlobalSearch) {
                  // 全域/條件搜尋模式
                  const matchTab = (currentTab === 'forsale') ? val.isForsale : (val.tab === currentTab);
                  if (matchTab) {
                    // 1. 關鍵字比對
                    let matchKey = true;
                    if (searchKeyword) {
                      const searchSource = [
                        val.title || '',
                        val.preTitle || '',
                        val.category || '',
                        val.itemType || '',
                        val.notes || '',
                        val.info || '',
                        val.albumText || ''
                      ].join(' ').toLowerCase();
                      matchKey = searchSource.includes(searchKeyword);
                    }

                    // 2. 日期區間比對 (在家: receivedDate, 預購: preDate)
                    let matchDate = true;
                    const itemDate = val.tab === 'arrived' ? val.receivedDate : val.preDate;

                    if (dateStart && (!itemDate || itemDate < dateStart)) matchDate = false;
                    if (dateEnd && (!itemDate || itemDate > dateEnd)) matchDate = false;

                    if (matchKey && matchDate) {
                      itemMap.set(val.id, val);
                    }
                  }
                } else {
                  // 無任何條件時：正常依據目前資料夾層級顯示
                  if (currentTab === 'forsale') {
                    if (val.isForsale && val.forsaleFolderId === currentFolderId) {
                      itemMap.set(val.id, val);
                    }
                  } else if (val.tab === currentTab && val.folderId === currentFolderId) {
                    itemMap.set(val.id, val);
                  }
                }
              }
              cursor2.continue();
            } else {
              let items = Array.from(itemMap.values());
              sortItemList(items, sortType);
              displayGridElements(folders, items);
            }
          };
        }
      };
    }

    function sortItemList(items, sortType) {
      if (sortType === 'date-desc') {
        items.sort((a,b) => new Date(b.receivedDate || b.preDate || 0) - new Date(a.receivedDate || a.preDate || 0));
      } else if (sortType === 'date-asc') {
        items.sort((a,b) => new Date(a.receivedDate || a.preDate || 0) - new Date(b.receivedDate || b.preDate || 0));
      } else if (sortType === 'price-desc') {
        items.sort((a,b) => (b.price || b.fullTotal || 0) - (a.price || a.fullTotal || 0));
      } else if (sortType === 'price-asc') {
        items.sort((a,b) => (a.price || a.fullTotal || 0) - (b.price || b.fullTotal || 0));
      }
    }

    function displayGridElements(folders, items) {
      const container = document.getElementById('grid-container');

      folders.forEach(f => {
        const div = document.createElement('div');
        div.className = 'card card-folder';
        div.onclick = () => navigateToFolder(f.id, f.name);
        
        let coverHtml = `<div style="font-size: 1.8rem; text-align:center; margin: 8px 0; color:var(--primary-color);">資料夾</div>`;
        if (f.coverPhoto) {
          coverHtml = `<img src="${f.coverPhoto}" class="card-img" alt="封面" loading="lazy">`;
        }

        div.innerHTML = `
          ${coverHtml}
          <div class="card-title">${f.name}</div>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="card-sub">資料夾</span>
            <button onclick="event.stopPropagation(); openFolderModal('${f.id}')" style="border:none; background:none; font-size:0.75rem; color:var(--text-sub);">編輯</button>
          </div>
        `;
        container.appendChild(div);
      });

      items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openItemModal(item);
        
        let imgUrl = null;
        if (item.photos && item.photos.length > 0) imgUrl = item.photos[0];
        if (!imgUrl && item.prePhotos && item.prePhotos.length > 0) imgUrl = item.prePhotos[0];

        let coverHtml = imgUrl 
          ? `<img src="${imgUrl}" class="card-img" alt="週邊圖" loading="lazy">` 
          : `<div class="card-no-img">無圖片</div>`;

        const title = item.title || item.preTitle || item.category;
        const priceDisplay = item.tab === 'arrived' ? `$${item.price || 0}` : getPreorderPriceBadge(item);
        
        let needSecondHtml = '';

    function populateFolderParentSelect() {

    function buildTreeOptions(folders, parentId, depth, selectEl, excludeFolderId = null) {
      folders.filter(f => f.parentId === parentId).forEach(f => {
        if (f.id === excludeFolderId) return;
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.innerText = '─'.repeat(depth) + ' ' + f.name;
        selectEl.appendChild(opt);
        buildTreeOptions(folders, f.id, depth + 1, selectEl, excludeFolderId);
      });
    }

    function calcHalfTotal() {
      const total = parseFloat(document.getElementById('pre-half-total').value) || 0;
      const paid = parseFloat(document.getElementById('pre-half-paid').value) || 0;
      const s = parseFloat(document.getElementById('pre-half-shipfee').value) || 0;

      document.getElementById('pre-half-unpaid').value = unpaid;
      document.getElementById('calc-half-res1').innerText = `1. 金額加總: $${total + s}`;
      document.getElementById('calc-half-res2').innerText = `2. 未付金額加總 (未付+運費): $${unpaid + s}`;
      return { totalWithShip: total + s, unpaidWithShip: unpaid + s };
    }

    function calcUnpaidTotal() {
      const p = parseFloat(document.getElementById('pre-unpaid-total').value) || 0;
      const s = parseFloat(document.getElementById('pre-unpaid-shipfee').value) || 0;

    function renderAllPhotoUploaders() {
      renderUploader('uploader-photos', imgStore.photos, 3, 'photos');

    function renderUploader(elementId, array, max, key) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.innerHTML = '';
      array.forEach((imgSrc, idx) => {
        const img = document.createElement('img');
        img.src = imgSrc; img.className = 'photo-preview';
        img.onclick = () => {
          if (confirm('是否刪除此照片？')) {
            array.splice(idx, 1); renderUploader(elementId, array, max, key);
          }
        };
        el.appendChild(img);
      });

      if (array.length < max) {
        const btn = document.createElement('div');
        btn.className = 'photo-add-btn'; btn.innerText = '＋';
        btn.onclick = () => triggerImageSelect(array, max, () => renderUploader(elementId, array, max, key));
        el.appendChild(btn);
      }
    }

    function triggerImageSelect(targetArray, max, callback) {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            let scale = MAX_WIDTH / img.width;
            if (scale > 1) scale = 1;
            canvas.width = img.width * scale; canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            targetArray.push(canvas.toDataURL('image/jpeg', 0.6));
            callback();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }

    function executeTransferToArrived() {
      if (!editingItemId) return;
      const secondFee = parseFloat(document.getElementById('transfer-second-fee').value) || 0;
      const targetFolderValue = document.getElementById('transfer-target-folder').value;
      const targetFolderId = targetFolderValue === "" ? null : targetFolderValue;

      const tx = db.transaction("items", "readonly");
      tx.objectStore("items").get(editingItemId).onsuccess = (e) => {
        const preItem = e.target.result;
        if (!preItem) return;

        let basePrice = preItem.fullTotal || preItem.halfTotal || preItem.unpaidTotal || parseFloat(preItem.otherTotal) || 0;
        let finalPrice = basePrice + secondFee;

        let infoText = `【原預購明細】\n`;
        infoText += `下單日期: ${preItem.preDate || '未填'}\n`;
        infoText += `預計抵達: ${preItem.preEta || '未填'}\n`;
        infoText += `付款狀態: ${preItem.payType}\n`;
        infoText += `二補金額: $${secondFee}\n`;
        if (preItem.preNotes) infoText += `原備註: ${preItem.preNotes}`;

        const arrivedItem = {
          id: preItem.id,
          tab: 'arrived',
          folderId: targetFolderId,
          isForsale: preItem.isForsale,
          forsaleFolderId: preItem.forsaleFolderId,
          category: preItem.category,
          itemType: preItem.itemType,
          title: preItem.preTitle || preItem.category,
          price: finalPrice,
          photos: preItem.prePhotos || [],
          proofs: preItem.preProofs || [],
          receivedDate: new Date().toISOString().split('T')[0],
          album: [], albumText: '', notes: preItem.preNotes || '', info: infoText
        };

        const writeTx = db.transaction("items", "readwrite");
        writeTx.objectStore("items").put(arrivedItem);
        writeTx.oncomplete = () => {
          alert('成功轉移至「在家/已到貨」！');
          closeModal('modal-transfer-dialog');
          closeModal('modal-item');
          switchTab('arrived');
        };
      };
    }

    function executeMarkAsSold() {
      if (!editingItemId) return;
      const sellPrice = parseFloat(document.getElementById('sell-price').value) || 0;
      const platformSelect = document.getElementById('sell-platform').value;
      const platformStr = platformSelect === '其他' ? document.getElementById('sell-platform-other').value : platformSelect;

      const buyerType = document.getElementById('sell-buyer-type').value;
      const buyerInfo = document.getElementById('sell-buyer-info').value;
      const sellDate = document.getElementById('sell-date').value;

      const tx = db.transaction("items", "readonly");
      tx.objectStore("items").get(editingItemId).onsuccess = (e) => {
        const item = e.target.result;
        if (!item) return;

        const originalCost = item.price || item.fullTotal || item.halfTotal || item.unpaidTotal || parseFloat(item.otherTotal) || 0;
        const profit = sellPrice - originalCost;

        item.isSold = true;
        item.soldData = {
          sellPrice: sellPrice,
          platform: platformStr,
          buyerType: buyerType,
          buyerInfo: buyerInfo,
          sellProofs: imgStore.sellProofs,
          sellDate: sellDate,
          profit: profit
        };

        const writeTx = db.transaction("items", "readwrite");
        writeTx.objectStore("items").put(item);
        writeTx.oncomplete = () => {
          alert(`已成功移至「已售出歸檔庫」！(損益: $${profit})`);
          closeModal('modal-sell-dialog');
          closeModal('modal-item');
          renderGrid();
        };
      };
    }

      if (!confirm('是否將此品項取消售出並復原回原本的資料夾？')) return;
      const tx = db.transaction("items", "readwrite");
      tx.objectStore("items").get(itemId).onsuccess = (e) => {
        const item = e.target.result;
        if (item) {
          item.isSold = false;
          tx.objectStore("items").put(item);
        }
      };
      tx.oncomplete = () => {
        renderSoldArchiveList();
        renderGrid();
      };
    }

    // --- Export Excel (複選分類連動 + SheetJS 原生 .xlsx 匯出) ---
    function openExportModal() { openModal('modal-export'); }

    function toggleExportCatAll(allCb) {
      const options = document.querySelectorAll('.export-cat-option');
      if (allCb.checked) {
        options.forEach(cb => cb.checked = false);
      }
    }

    function toggleExportCatSub() {
      const allCb = document.getElementById('export-cat-all');
      const options = document.querySelectorAll('.export-cat-option');
      let hasCheckedSub = false;
      options.forEach(cb => {
        if (cb.checked) hasCheckedSub = true;
      });

      if (hasCheckedSub) {
        allCb.checked = false;
      } else {
        allCb.checked = true;
      }
    }

    function executeExportXlsx() {
      const range = document.getElementById('export-range').value;
      const includeSold = document.getElementById('export-include-sold').checked;
      const isAllCat = document.getElementById('export-cat-all').checked;

      let selectedCategories = [];
      if (!isAllCat) {
        document.querySelectorAll('.export-cat-option:checked').forEach(cb => {
          selectedCategories.push(cb.value);
        });
      }

      const tx = db.transaction("items", "readonly");
      tx.objectStore("items").getAll().onsuccess = (e) => {
        let items = e.target.result;

        if (!includeSold) items = items.filter(i => !i.isSold);

        if (range === 'arrived') items = items.filter(i => i.tab === 'arrived');
        if (range === 'preorder') items = items.filter(i => i.tab === 'preorder');
        if (range === 'forsale') items = items.filter(i => i.isForsale);

        if (!isAllCat && selectedCategories.length > 0) {
          items = items.filter(i => selectedCategories.includes(i.category));
        }

        const excelData = items.map(i => {
          const status = i.isSold ? '已售出' : (i.tab === 'arrived' ? '在家' : '預購');
          const category = i.category || '';
          const itemType = i.itemType || '';
          const name = i.title || i.preTitle || '';
          const date = i.receivedDate || i.preDate || '';

          let itemCost = 0; let shipFee = 0; let secondFee = 0; let unpaidAmount = 0;

          if (i.tab === 'arrived') {
            itemCost = i.price || 0; unpaidAmount = 0;
          } else {
            if (i.payType === '全付') {
              itemCost = i.fullPrice || 0; shipFee = i.fullShipFee || 0; unpaidAmount = 0;
            } else if (i.payType === '付一半（訂金）') {
              itemCost = i.halfPrice || 0; shipFee = i.halfShipFee || 0; unpaidAmount = (itemCost - (i.halfPaid || 0)) + shipFee;
            } else if (i.payType === '未付') {
              itemCost = i.unpaidPrice || 0; shipFee = i.unpaidShipFee || 0; unpaidAmount = itemCost + shipFee;
            } else {
              itemCost = parseFloat(i.otherTotal) || 0; unpaidAmount = 0;
            }
          }

          const totalCost = itemCost + shipFee + secondFee;

          return {
            "狀態": status,
            "分類": category,
            "品項": itemType,
            "名稱": name,
            "日期": date,
            "商品金額": itemCost,
            "運費": shipFee,
            "二補金額": secondFee,
            "總支出": totalCost,
            "待付金額": unpaidAmount
          };
        });

        if (excelData.length === 0) {
          alert('當前選擇的條件下沒有資料可以匯出！');
          return;
        }

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "週邊明細");

        const max_width = excelData.reduce((w, r) => Math.max(w, r.名稱 ? r.名稱.length : 10), 10);
        worksheet['!cols'] = [ { wch: 8 }, { wch: 15 }, { wch: 10 }, { wch: Math.min(max_width + 5, 30) }, { wch: 12 }, { wch: 10 }, { wch: 8 }, { wch: 10 }, { wch: 10 }, { wch: 10 } ];

        const todayStr = new Date().toISOString().split('T')[0];
        XLSX.writeFile(workbook, `週邊們_收支表_${todayStr}.xlsx`);

        closeModal('modal-export');
      };
    }

    // --- Backup & Restore (JSON) ---
    function backupData() {
      const tx = db.transaction(["folders", "items"], "readonly");
      let exportData = { folders: [], items: [] };

      tx.objectStore("folders").getAll().onsuccess = (e) => {
        exportData.folders = e.target.result;
        tx.objectStore("items").getAll().onsuccess = (e2) => {
          exportData.items = e2.target.result;
          const blob = new Blob([JSON.stringify(exportData)], { type: "application/json" });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `週邊們完整備份_${new Date().toISOString().split('T')[0]}.json`;
          a.click();
        };
      };
    }

    function restoreData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data && (Array.isArray(data.items) || Array.isArray(data.folders))) {
              const tx = db.transaction(["folders", "items"], "readwrite");
              const folderStore = tx.objectStore("folders");
              const itemStore = tx.objectStore("items");

              if (Array.isArray(data.folders)) {
                data.folders.forEach(f => {
                  if (!f.tab) f.tab = 'arrived';
                  if (!f.parentId) f.parentId = null;
                  folderStore.put(f);
                });
              }

              if (Array.isArray(data.items)) {
                data.items.forEach(i => {
                  if (i.isForsale === undefined) i.isForsale = false;
                  if (i.isSold === undefined) i.isSold = false;
                  if (!i.tab) i.tab = 'arrived';
                  if (!i.folderId) i.folderId = null;
                  itemStore.put(i);
                });
              }

              tx.oncomplete = () => {
                alert('還原成功！舊資料已順利升級並匯入。');
                renderGrid();
              };
            } else {
              alert('格式不符：請確認選擇的是副檔名為 .json 的備份檔案！');
            }
          } catch (err) {
            alert('解析失敗：檔案可能已損壞或格式不符。');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }
  </script>
